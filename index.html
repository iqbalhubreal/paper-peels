<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Peels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1E2D3D;
    --navy-soft:#2B3E52;
    --cream:#FDF6E9;
    --paper:#FAF1E0;
    --amber:#F0A830;
    --coral:#E8A0A0;
    --ink:#1E2D3D;
    --ink-mute:#5E7186;
    --line:rgba(30,45,61,.12);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--cream);color:var(--ink);
    font-family:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block}
  a{color:inherit}
  .wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 28px}

  /* ── header ── */
  .masthead{background:var(--navy);color:var(--cream)}
  .masthead .wrap{display:flex;align-items:center;gap:14px;padding-top:20px;padding-bottom:20px}
  .mark{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none}
  .brand{
    font-family:"Bricolage Grotesque",sans-serif;
    font-weight:700;font-size:1.18rem;letter-spacing:-.02em;line-height:1;
  }

  /* ── hero ── */
  .hero{background:var(--navy);color:var(--cream);position:relative;padding-bottom:86px}
  .hero .wrap{padding-top:8px;padding-bottom:64px;max-width:860px}
  .hero h1{
    font-family:"Bricolage Grotesque",sans-serif;font-weight:700;
    font-size:clamp(2.2rem,6vw,4rem);
    line-height:1.03;letter-spacing:-.035em;
    margin:0 0 18px;max-width:16ch;
  }
  .hero p{margin:0;max-width:52ch;color:#B9C8D6;font-size:1.06rem}

  /* search seam */
  .seam{position:absolute;left:0;right:0;bottom:-30px}
  .search{
    max-width:560px;margin:0 auto;position:relative;
    background:var(--cream);border-radius:999px;
    box-shadow:0 10px 32px rgba(30,45,61,.24);
  }
  .search input{
    width:100%;border:0;background:transparent;
    font:inherit;color:var(--ink);
    padding:19px 56px 19px 26px;border-radius:999px;
  }
  .search input::placeholder{color:#93A5B5}
  .search input:focus{outline:2px solid var(--amber);outline-offset:2px}
  .search svg{
    position:absolute;right:22px;top:50%;transform:translateY(-50%);
    width:19px;height:19px;stroke:var(--ink-mute);fill:none;stroke-width:2;
  }

  /* ── sticker list ── */
  main{padding:92px 0 72px}
  .count{color:var(--ink-mute);font-size:.9rem;margin:0 0 16px;letter-spacing:.01em}

  .stickerlist{
    display:flex;flex-direction:column;gap:8px;
    list-style:none;margin:0;padding:0;
  }

  /* ── horizontal card ── */
  .card{
    position:relative;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    display:flex;align-items:stretch;
    overflow:hidden;
    transition:box-shadow .2s ease, border-color .2s ease;
  }
  .card:hover{
    box-shadow:0 6px 24px rgba(30,45,61,.11);
    border-color:rgba(30,45,61,.2);
  }
  /* amber left bar */
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;
    width:4px;background:var(--amber);
    border-radius:10px 0 0 10px;z-index:1;
  }

  /* ── image thumbnail (fixed 2:3 ratio) ── */
  .card-img{
    width:100px;min-width:100px;
    aspect-ratio:1/1;
    background:#EDE0C8;
    position:relative;overflow:hidden;
    margin:4px 0 4px 4px; /* clear the accent bar, breathing room top/bottom */
    border-radius:6px;
    align-self:center;
  }
  .card-img img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .card-img .ph{
    width:100%;height:100%;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:6px;color:#B8A07A;font-size:.76rem;
  }
  .card-img .ph svg{width:26px;height:26px;stroke:#C4A97A;fill:none;stroke-width:1.5}

  /* ── body ── */
  .card-body{
    flex:1;min-width:0;
    padding:12px 20px;
    display:flex;flex-direction:column;justify-content:center;gap:4px;
  }
  .card-title{
    font-family:"Bricolage Grotesque",sans-serif;
    font-weight:600;font-size:1.08rem;letter-spacing:-.015em;
    line-height:1.28;
    margin:0;
    white-space:normal;word-break:break-word;overflow-wrap:break-word;
  }
  .card-kind{color:var(--ink-mute);font-size:.82rem;margin:0}

  /* ── action ── */
  .card-action{
    flex:none;
    display:flex;align-items:center;justify-content:center;
    padding:12px 20px;
    border-left:1px solid var(--line);
  }
  .dl{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--navy);color:var(--cream);
    text-decoration:none;font-weight:500;font-size:.92rem;
    padding:12px 22px;border-radius:7px;white-space:nowrap;
    transition:background .18s ease;
  }
  .dl:hover{background:var(--navy-soft)}
  .dl:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .dl svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;flex:none}

  .empty{padding:48px 0;color:var(--ink-mute)}

  /* ── footer ── */
  footer{background:var(--navy);color:var(--cream);padding:56px 0 40px}
  .foot-note{max-width:40ch;color:#B9C8D6;margin:0 0 28px}
  .links{display:flex;flex-wrap:wrap;gap:10px 28px;margin:0 0 36px;padding:0;list-style:none}
  .links a{text-decoration:none;border-bottom:1px solid rgba(253,246,233,.28);padding-bottom:2px}
  .links a:hover{color:var(--amber);border-bottom-color:var(--amber)}
  .links a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
  .copy{color:#7B8FA3;font-size:.86rem;margin:0}

  @media(max-width:600px){
    .wrap{padding:0 16px}
    main{padding-top:82px}
    .stickerlist{gap:6px}
    .card-img{width:72px;min-width:72px;margin:3px 0 3px 3px}
    .card-body{padding:6px 10px;gap:2px}
    .card-action{padding:6px 10px}
    .dl{padding:7px 12px;font-size:.8rem;gap:5px}
    .dl svg{width:12px;height:12px}
    .card-title{font-size:.88rem}
    .card-kind{font-size:.72rem}
  }
  @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <img class="mark" id="logo" alt="">
    <span class="brand" id="brandName"></span>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1 id="heroHeadline"></h1>
    <p id="heroSubtext"></p>
  </div>
  <div class="seam">
    <div class="wrap">
      <div class="search">
        <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search stickers</label>
        <input id="q" type="search" autocomplete="off">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </div>
    </div>
  </div>
</section>

<main>
  <div class="wrap">
    <p class="count" id="count"></p>
    <ul class="stickerlist" id="stickerlist"></ul>
    <div class="empty" id="empty" hidden></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <p class="foot-note" id="footerNote"></p>
    <ul class="links" id="links"></ul>
    <p class="copy" id="copyright"></p>
  </div>
</footer>

<script>
const FALLBACK_SITE = {
  brandName:"Paper Peels",logo:"",
  heroHeadline:"Stickers made to be peeled, not scrolled past.",
  heroSubtext:"A small library of hand-drawn stickers. Pick one, download the print file, peel it later.",
  searchPlaceholder:"Search stickers",
  downloadLabel:"Download",
  emptyStateText:"Nothing matches that. Try a shorter word.",
  footerNote:"New stickers land every few weeks. Best place to catch them is Instagram.",
  instagramUrl:"https://instagram.com/paperpeels",instagramLabel:"Instagram",
  pinterestUrl:"https://pinterest.com/paperpeels",pinterestLabel:"Pinterest",
  email:"hello@paperpeels.com",emailLabel:"Email",
  copyright:"© 2026 Paper Peels"
};
const FALLBACK_STICKERS=[
  {title:"Little House",preview:"",downloadUrl:"#",fileType:"PDF",downloadLabel:"",featured:true},
  {title:"Daisy Cluster",preview:"",downloadUrl:"#",fileType:"PNG",downloadLabel:"",featured:false},
  {title:"Folded Note",preview:"",downloadUrl:"#",fileType:"PDF",downloadLabel:"",featured:false},
  {title:"Window Light",preview:"",downloadUrl:"#",fileType:"JPG",downloadLabel:"",featured:false}
];

let SITE=FALLBACK_SITE, STICKERS=FALLBACK_STICKERS;

async function load(path,fb){
  try{const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw 0;return await r.json();}
  catch(e){return fb;}
}
const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v||"";};

function renderSite(){
  document.title=SITE.brandName||"Paper Peels";
  set("brandName",SITE.brandName);
  set("heroHeadline",SITE.heroHeadline);
  set("heroSubtext",SITE.heroSubtext);
  set("footerNote",SITE.footerNote);
  set("copyright",SITE.copyright);
  const lg=document.getElementById("logo");
  if(SITE.logo){lg.src=SITE.logo;lg.alt=SITE.brandName||"";}else{lg.style.display="none";}
  document.getElementById("q").placeholder=SITE.searchPlaceholder||"Search";
  const ul=document.getElementById("links");ul.innerHTML="";
  const add=(lbl,href)=>{
    if(!href)return;
    const li=document.createElement("li"),a=document.createElement("a");
    a.textContent=lbl;a.href=href;
    if(href.startsWith("http")){a.target="_blank";a.rel="noopener";}
    li.appendChild(a);ul.appendChild(li);
  };
  add(SITE.instagramLabel||"Instagram",SITE.instagramUrl);
  add(SITE.pinterestLabel||"Pinterest",SITE.pinterestUrl);
  add(SITE.emailLabel||"Email",SITE.email?"mailto:"+SITE.email:"");
}

function ph(){
  return `<div class="ph"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>Image</span></div>`;
}

function cardFor(s){
  const li=document.createElement("li");li.className="card";

  // image
  const iw=document.createElement("div");iw.className="card-img";
  if(s.preview){
    const img=document.createElement("img");
    img.src=s.preview;img.alt=s.title||"";img.loading="lazy";
    img.onerror=()=>{iw.innerHTML=ph();};
    iw.appendChild(img);
  } else { iw.innerHTML=ph(); }

  // body
  const body=document.createElement("div");body.className="card-body";
  const h=document.createElement("h2");h.className="card-title";h.textContent=s.title||"Untitled";
  body.appendChild(h);
  if(s.fileType){const k=document.createElement("p");k.className="card-kind";k.textContent=s.fileType+" file";body.appendChild(k);}

  // action
  const act=document.createElement("div");act.className="card-action";
  const a=document.createElement("a");a.className="dl";
  a.href=s.downloadUrl||"#";
  a.setAttribute("download","");a.rel="noopener";
  const lbl=s.downloadLabel||SITE.downloadLabel||"Download";
  a.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>`;
  a.append(document.createTextNode(lbl));
  a.setAttribute("aria-label",lbl+" "+(s.title||""));
  act.appendChild(a);

  li.append(iw,body,act);
  return li;
}

function render(q){
  q=(q||"").trim().toLowerCase();
  const items=STICKERS
    .filter(s=>!q||(s.title||"").toLowerCase().includes(q))
    .sort((a,b)=>(b.featured===true)-(a.featured===true));
  const el=document.getElementById("stickerlist");
  const em=document.getElementById("empty");
  el.innerHTML="";
  items.forEach(s=>el.appendChild(cardFor(s)));
  em.hidden=items.length>0;
  em.textContent=SITE.emptyStateText||"";
  set("count",items.length===1?"1 item":items.length+" items");
}

(async function(){
  const[site,stickers]=await Promise.all([
    load("content/site.json",FALLBACK_SITE),
    load("content/stickers.json",FALLBACK_STICKERS)
  ]);
  SITE=site;STICKERS=Array.isArray(stickers)?stickers:FALLBACK_STICKERS;
  renderSite();render("");
  document.getElementById("q").addEventListener("input",e=>render(e.target.value));
})();
</script>
</body>
</html>
